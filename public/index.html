<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <h1>Tic-Tac-Toe</h1>
    <p id="me" class="me"></p>
    <p id="matchup" class="matchup" aria-label="Current match"></p>
    <p id="status" class="status" role="status" aria-live="polite">Connecting…</p>
    <p id="detail" class="detail"></p>
    <p id="timer" class="timer" role="timer" hidden></p>
    <div class="board-wrap">
      <div id="board" class="board board--inactive" role="grid" aria-label="Game board"></div>
      <div id="spectate-overlay" class="spectate-overlay" hidden>
        <span class="spectate-overlay__label">👀 Spectating</span>
      </div>
    </div>

    <section class="line" aria-labelledby="line-heading">
      <h2 id="line-heading">Waiting in line</h2>
      <ol id="line-list" class="line__list"></ol>
      <p id="line-empty" class="line__empty">Nobody waiting</p>
    </section>
  </main>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
