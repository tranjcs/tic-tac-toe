name: Deploy to dev

# Runs on every push to main, so every commit on main has a tested dev image that can be
# promoted to prod. To try a branch on dev: Actions → "Deploy to dev" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

defaults:
  run:
    shell: bash # explicit bash adds -o pipefail, so `script | tee` fails when the script fails

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Settings are secrets in the "dev" GitHub Environment (masked in the public logs), not in the repo.
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # lets GitHub issue the token Google exchanges for short-lived credentials
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
    steps:
      - name: Check configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          missing=()
          [[ -n "$PROJECT_ID" ]] || missing+=(GCP_PROJECT_ID)
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WIF_PROVIDER)
          [[ -n "$DEPLOY_SA" ]] || missing+=(GCP_DEPLOY_SA)
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets in the 'dev' environment: ${missing[*]}. See 'Deploy from GitHub' in the README."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Pinned version; the Go checksum database verifies the download.
      - name: Install crane
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

      # Build once per commit. If this commit's image already exists (the workflow is rerun),
      # deploy that exact image instead of rebuilding: a rebuild could pick up a newer base
      # image and no longer match what was tested and later promoted to prod.
      - name: Build and push image (once per commit)
        run: |
          REPO="${REGION}-docker.pkg.dev/${PROJECT_ID}/tic-tac-toe/app"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          if digest="$(crane digest "${REPO}:${GITHUB_SHA}" 2>/dev/null)"; then
            echo "Image for ${GITHUB_SHA::7} already exists; deploying it without rebuilding."
          else
            docker build -t "${REPO}:${GITHUB_SHA}" .
            docker push "${REPO}:${GITHUB_SHA}"
            digest="$(crane digest "${REPO}:${GITHUB_SHA}")"
          fi
          echo "IMAGE=${REPO}@${digest}" >> "$GITHUB_ENV"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"

      # Terraform (tranjcs/terrabrew) owns every other setting of the service, including its
      # environment variables, so the deploy only changes which image runs.
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run services update tic-tac-toe \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" --quiet
          url="$(gcloud run services describe tic-tac-toe --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "Deployed \`${GITHUB_SHA::7}\` to $url"
            echo
            echo "Image digest: \`${DIGEST}\`"
            echo
            echo "To release this build to prod, tag this commit (e.g. \`git tag v1.2.3 ${GITHUB_SHA::7} && git push origin v1.2.3\`)."
          } >> "$GITHUB_STEP_SUMMARY"
