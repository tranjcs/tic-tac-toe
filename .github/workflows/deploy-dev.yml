name: Deploy to dev

# Manual only: Actions → "Deploy to dev" → Run workflow (pick a branch).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

defaults:
  run:
    shell: bash # explicit bash adds -o pipefail, so `script | tee` fails when the script fails

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Settings are secrets in the "dev" GitHub Environment (masked in the public logs), not in the repo.
    environment:
      name: dev
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # lets GitHub issue the token Google exchanges for short-lived credentials
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
      # Optional. A Measurement ID is public, so it's an environment variable, not a secret.
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - name: Check configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          missing=()
          [[ -n "$PROJECT_ID" ]] || missing+=(GCP_PROJECT_ID)
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WIF_PROVIDER)
          [[ -n "$DEPLOY_SA" ]] || missing+=(GCP_DEPLOY_SA)
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets in the 'dev' environment: ${missing[*]}. Run scripts/setup-github-deploy.sh and see the README."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/tic-tac-toe/app:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          ./scripts/deploy-cloudrun.sh | tee deploy.log
          url="$(tail -n 1 deploy.log)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${GITHUB_SHA::7}\` to $url" >> "$GITHUB_STEP_SUMMARY"
