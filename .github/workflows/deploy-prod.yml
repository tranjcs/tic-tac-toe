name: Deploy to prod

# Releases to prod by promoting the image already built and tested in dev. Never builds.
#
# Release:  tag a commit on main that is deployed to dev, then push the tag:
#             git tag v1.2.3 <sha> && git push origin v1.2.3
# Redeploy: Actions → "Deploy to prod" → Run workflow → "Use workflow from" → pick the tag.
#           (Picking an older tag rolls back to it.)
#
# The "prod" GitHub Environment should require a reviewer and allow only v* tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Settings are secrets in the "prod" GitHub Environment (masked in the public logs), not in the repo.
    environment:
      name: prod
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # lets GitHub issue the token Google exchanges for short-lived credentials
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      DEV_PROJECT_ID: ${{ secrets.DEV_GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
      TAG: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Check release tag and configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          if [[ "$REF_TYPE" != "tag" || ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run this from a release tag like v1.2.3 (Run workflow → Use workflow from → Tags)."
            exit 1
          fi
          missing=()
          [[ -n "$PROJECT_ID" ]] || missing+=(GCP_PROJECT_ID)
          [[ -n "$DEV_PROJECT_ID" ]] || missing+=(DEV_GCP_PROJECT_ID)
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WIF_PROVIDER)
          [[ -n "$DEPLOY_SA" ]] || missing+=(GCP_DEPLOY_SA)
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets in the 'prod' environment: ${missing[*]}. See 'GitHub setup' in the README."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to check the tag is on main

      - name: Check the tagged commit is on main
        run: |
          SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::${TAG} points at ${SHA::7}, which isn't on main. Only commits merged to main can be released."
            exit 1
          fi
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Pinned version; the Go checksum database verifies the download.
      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Copy the exact image dev built for this commit. crane copies the manifest as-is,
      # so the digest in prod is identical to the one tested in dev.
      - name: Promote image from dev
        run: |
          SRC="${REGION}-docker.pkg.dev/${DEV_PROJECT_ID}/tic-tac-toe/app:${SHA}"
          DST="${REGION}-docker.pkg.dev/${PROJECT_ID}/tic-tac-toe/app"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

          if ! src_digest="$(crane digest "$SRC")"; then
            echo "::error::No dev image for ${SHA::7}. Deploy this commit to dev first (Actions → Deploy to dev, from main), then rerun."
            exit 1
          fi

          crane copy "$SRC" "${DST}:${TAG}"
          crane tag "${DST}:${TAG}" "$SHA"

          dst_digest="$(crane digest "${DST}:${TAG}")"
          if [[ "$src_digest" != "$dst_digest" ]]; then
            echo "::error::Digest changed during copy ($src_digest → $dst_digest)."
            exit 1
          fi
          echo "IMAGE=${DST}@${dst_digest}" >> "$GITHUB_ENV"
          echo "DIGEST=${dst_digest}" >> "$GITHUB_ENV"

      # Terraform (tranjcs/terrabrew) owns every other setting of the service, including its
      # environment variables, so the deploy only changes which image runs.
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run services update tic-tac-toe \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" --quiet
          url="$(gcloud run services describe tic-tac-toe --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "Released \`${TAG}\` (\`${SHA::7}\`) to $url"
            echo
            echo "Image digest: \`${DIGEST}\` (same as dev)"
          } >> "$GITHUB_STEP_SUMMARY"
