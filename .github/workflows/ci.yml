name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Stop superseded runs on the same PR; let every run on main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Single, stable check to require in branch protection, independent of the matrix above.
  ci-ok:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All tests passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test result: $RESULT"
          [[ "$RESULT" == "success" ]]
